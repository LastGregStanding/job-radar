name: job-radar
services:
  db:
    image: postgres:17
    container_name: job-radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: jobradar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d jobradar"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  poller:
    build: .
    container_name: job-radar-poller
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
